<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Doc' O Clock">
  <title>Doc' O Clock</title>
  <rect width="512" height="512" rx="128" fill="#397DFF"/>
  <circle cx="256" cy="268" r="148" fill="#FFFFFF"/>
  <circle cx="256" cy="268" r="132" fill="none" stroke="#E0EBFF" stroke-width="10"/>
  <!-- 12 ember medical cross -->
  <rect x="236" y="48" width="40" height="88" rx="10" fill="#F55C15"/>
  <rect x="212" y="72" width="88" height="40" rx="10" fill="#F55C15"/>
  <!-- hour marks -->
  <circle cx="256" cy="156" r="7" fill="#397DFF"/>
  <circle cx="356" cy="268" r="7" fill="#397DFF"/>
  <circle cx="256" cy="380" r="7" fill="#397DFF"/>
  <circle cx="156" cy="268" r="7" fill="#397DFF"/>
  <!-- hands ~10:10 -->
  <line x1="256" y1="268" x2="210" y2="188" stroke="#171717" stroke-width="16" stroke-linecap="round"/>
  <line x1="256" y1="268" x2="332" y2="196" stroke="#397DFF" stroke-width="12" stroke-linecap="round"/>
  <circle cx="256" cy="268" r="18" fill="#171717"/>
  <circle cx="256" cy="268" r="8" fill="#FFFFFF"/>
</svg>
