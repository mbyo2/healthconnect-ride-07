  <style>
    .js-error-fallback {
      display: none;
      padding: 20px;
      text-align: center;
      font-family: Figtree, system-ui, -apple-system, sans-serif;
      max-width: 500px;
      margin: 100px auto;
    }

    .js-error-fallback button {
      background: #397dff;
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      margin-top: 16px;
    }
  </style>

<body>
  <div id="root">
    <div style="display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; background: #fafafa;">
      <div
        style="width: 48px; height: 48px; border: 3px solid #e5e5e5; border-top: 3px solid #397dff; border-radius: 50%; animation: spin 1s linear infinite;">
      </div>
      <p style="margin-top: 20px; font-family: Figtree, system-ui, -apple-system, sans-serif; color: #57534e;">Loading Doc' O Clock...</p>
      <style>
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
    </div>
  </div>

  <div class="js-error-fallback">
    <h2>Unable to load Doc' O Clock</h2>
    <p>We encountered a problem while loading the application. Please try refreshing the page.</p>
    <button id="doc-refresh-btn">Refresh Page</button>
  </div>

  <noscript>
    <div style="padding: 20px; text-align: center; font-family: sans-serif;">
      <h1>JavaScript Required</h1>
      <p>You need to enable JavaScript to run this app. Doc' O Clock requires JavaScript to provide you with the best
        healthcare experience.</p>
    </div>
  </noscript>

  <script>
    setTimeout(function () {
      if (!window.appLoaded) {
        var el = document.querySelector('.js-error-fallback');
        if (el) el.style.display = 'block';
      }
    }, 15000);

    // Self-heal for stale service-worker shells: if a previously installed
    // service worker is serving a cached '/' from an older deployment, its
    // hashed JS bundles no longer exist and the app can never boot. Tapping
    // refresh unregisters service workers first so the reload fetches fresh.
    (function () {
      var btn = document.getElementById('doc-refresh-btn');
      if (!btn) return;
      btn.addEventListener('click', function () {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
          }).catch(function () {}).then(function () {
            window.location.reload();
          });
        } else {
          window.location.reload();
        }
      });
    })();
  </script>

  <script type="module" src="/src/main.tsx"></script>
</body>
