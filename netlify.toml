# NOTE: Do NOT add a www -> apex (or apex -> www) redirect here.
# The host provider's dashboard already owns the canonical-domain redirect.
# Defining it in both places creates an infinite redirect loop (ERR_TOO_MANY_REDIRECTS).


# SPA fallback (must stay last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), microphone=(self), camera=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:; media-src 'self' blob: https:; frame-src 'self' https://*.daily.co; form-action 'self' https://www.paypal.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.daily.co wss://*.daily.co https://api.ipapi.co https://ipapi.co https://*.tile.openstreetmap.org https://nominatim.openstreetmap.org https://open.er-api.com;"
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'sha256-nfwlMxowaICUgPT4JNPCzFRJJR0xwQS2zYz8JnvhOuU=' 'sha256-kGOlkQuQtjtgclLz5qUkd9pm4S4t35WArGuuq+2POOk=' 'sha256-cSyLmD8WzZko5zEn/mKnwaMAYrR25fOmwJxX9l38oU4=' 'sha256-Q8v5vLx7i2M+pVJ2EQkbJeEFBKF/zfPmhNvYoQkHYn0=' https://pay.lenco.co https://pay.sandbox.lenco.co; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:; media-src 'self' blob: https:; frame-src 'self' https://*.daily.co https://pay.lenco.co https://pay.sandbox.lenco.co; form-action 'self' https://www.paypal.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.daily.co wss://*.daily.co https://api.ipapi.co https://ipapi.co https://*.tile.openstreetmap.org https://nominatim.openstreetmap.org https://open.er-api.com;"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
