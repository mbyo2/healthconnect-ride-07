  VITE_SUPABASE_PROJECT_ID = "tthzcijscedgxjfnfnky"
  VITE_SITE_URL = "https://doc0clock.online"

# Force the apex domain as canonical
[[redirects]]
  from = "https://www.doc0clock.online/*"
  to = "https://doc0clock.online/:splat"
  status = 301
  force = true

# SPA fallback (must stay last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), microphone=(self), camera=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.gpteng.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com data:; media-src 'self' blob: https:; frame-src 'self' https://secure.3gdirectpay.com; form-action 'self' https://secure.3gdirectpay.com https://www.paypal.com; connect-src 'self' https://tthzcijscedgxjfnfnky.supabase.co wss://tthzcijscedgxjfnfnky.supabase.co https://secure.3gdirectpay.com https://api.ipapi.co https://ipapi.co https://*.tile.openstreetmap.org https://nominatim.openstreetmap.org;"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
